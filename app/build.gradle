plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.radhi.invtcharger'
    compileSdk 34

    defaultConfig {
        applicationId "com.radhi.invtcharger"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // fixed key committed to the repo so every build signs identically
            // and new APKs install over the top of older ones (no uninstall needed).
            storeFile file("invt.jks")
            storePassword "invtcharger"
            keyAlias "invt"
            keyPassword "invtcharger"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}
